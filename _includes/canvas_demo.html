<div class="canvas-card" id="demo">
  <div class="canvas-card-header">
    <div class="canvas-status">
      <span class="brand-dot"></span>
      <span id="canvasStatusText">Ready to record gestures</span>
    </div>
    <div class="countdown-box" id="countdownBox">
      SELF-DESTRUCT: 8.0s
    </div>
  </div>

  <div class="canvas-viewport">
    <canvas id="demoCanvas"></canvas>
    <div class="canvas-placeholder-hint" id="canvasHint">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
        <path d="M2 2l7.586 7.586"/>
        <circle cx="11" cy="11" r="2"/>
      </svg>
      <p>Touch or click and drag to draw a trail note...</p>
    </div>
  </div>

  <div class="canvas-controls" id="canvasControls">
    <div class="palette-picker" id="palettePicker" title="Select Phosphor Color">
      <button class="color-dot active" data-color="cyan" style="background: #00f2fe;" aria-label="Cyan Phosphor"></button>
      <button class="color-dot" data-color="magenta" style="background: #ff0844;" aria-label="Magenta Neon"></button>
      <button class="color-dot" data-color="lime" style="background: #00ff87;" aria-label="Acid Lime"></button>
      <button class="color-dot" data-color="violet" style="background: #7f00ff;" aria-label="Electric Violet"></button>
      <button class="color-dot" data-color="amber" style="background: #fee140;" aria-label="Solar Gold"></button>
    </div>

    <div class="action-buttons" id="actionButtons">
      <button class="btn-xs" id="clearBtn">Clear</button>
      <button class="btn-xs" id="playBtn">Replay Note</button>
      <button class="btn-xs btn-xs-primary" id="shareBtn" title="Share drawn trail via instant link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: -1px; display: inline-block;">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        Share Trail
      </button>
    </div>

    <div class="viewer-actions" id="viewerActions" style="display: none;">
      <span class="viewer-tag" id="viewerTag">🔒 Secret Message Received</span>
      <button class="btn-xs btn-xs-primary" id="replyBtn" style="display: none;">Reply with a Finger Trail</button>
    </div>
  </div>
</div>
