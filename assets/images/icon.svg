<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="45%" stop-color="#0b1022"/>
      <stop offset="85%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Subtle Bevel Edge -->
    <linearGradient id="edgeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ff0844" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Trail Core Gradient -->
    <linearGradient id="trailGrad" x1="18%" y1="22%" x2="82%" y2="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#00f2fe"/>
      <stop offset="42%" stop-color="#4facfe"/>
      <stop offset="68%" stop-color="#b133ff"/>
      <stop offset="88%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>

    <!-- Multi-tier Neon Glow Filters -->
    <filter id="bloomDeep" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bloomSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="234" fill="url(#bgGrad)" stroke="url(#edgeStroke)" stroke-width="4"/>

  <!-- Ambient Under-glow Atmosphere -->
  <g opacity="0.35" filter="url(#bloomSoft)">
    <circle cx="512" cy="460" r="280" fill="#00f2fe"/>
    <circle cx="580" cy="560" r="240" fill="#ff0844"/>
  </g>

  <!-- Deep Trail Outer Glow Path -->
  <path d="M 280,310 C 370,220 540,240 650,330 C 760,420 780,590 680,700 C 580,810 390,820 320,730 C 260,650 310,540 430,490 C 540,440 680,480 750,560"
        fill="none"
        stroke="url(#trailGrad)"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.55"
        filter="url(#bloomDeep)" />

  <!-- Mid Trail Vivid Phosphor Ribbon -->
  <path d="M 280,310 C 370,220 540,240 650,330 C 760,420 780,590 680,700 C 580,810 390,820 320,730 C 260,650 310,540 430,490 C 540,440 680,480 750,560"
        fill="none"
        stroke="url(#trailGrad)"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9" />

  <!-- Core White-Hot Kinetic Beam -->
  <path d="M 280,310 C 370,220 540,240 650,330 C 760,420 780,590 680,700 C 580,810 390,820 320,730 C 260,650 310,540 430,490 C 540,440 680,480 750,560"
        fill="none"
        stroke="#ffffff"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.95" />

  <!-- Fingertip Touch Impulse Node (Point of Gesture Contact) -->
  <g transform="translate(280, 310)" filter="url(#sparkle)">
    <!-- Sensory Halo Rings -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.55"/>
    <circle cx="0" cy="0" r="34" fill="#00f2fe" opacity="0.4" filter="url(#bloomSoft)"/>
    <!-- Core Fingertip Plasma -->
    <circle cx="0" cy="0" r="22" fill="#00f2fe"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>
  </g>

  <!-- Ephemeral Disintegrating Ember Sparks (The 8-Second Evaporation) -->
  <g filter="url(#sparkle)">
    <circle cx="760" cy="565" r="13" fill="#ffffff"/>
    <circle cx="790" cy="540" r="9" fill="#fee140" opacity="0.9"/>
    <circle cx="815" cy="580" r="6" fill="#ff0844" opacity="0.8"/>
    <circle cx="830" cy="525" r="4.5" fill="#fee140" opacity="0.7"/>
    <circle cx="845" cy="555" r="3" fill="#00f2fe" opacity="0.75"/>
    
    <circle cx="340" cy="770" r="5" fill="#ff0844" opacity="0.7"/>
    <circle cx="360" cy="800" r="4" fill="#fee140" opacity="0.6"/>
    
    <circle cx="690" cy="310" r="6" fill="#00f2fe" opacity="0.75"/>
    <circle cx="725" cy="285" r="4" fill="#4facfe" opacity="0.6"/>
  </g>
</svg>